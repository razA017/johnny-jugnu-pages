<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order Confirmed — JOHNNY & JUGNU</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Inter:wght@400;500;600&display=swap');

  :root {
    --maroon: #6E1423;
    --maroon-deep: #4A0E18;
    --cream: #FFF6E5;
    --marigold: #F4A300;
    --ember: #FF7A45;
    --charcoal: #241412;
    --ash: #8C8073;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    font-family: 'Inter', sans-serif;
    color: var(--charcoal);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .band {
    width: 100%;
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-deep) 100%);
    padding: 28px 20px 60px;
    text-align: center;
  }

  .wordmark {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(22px, 6vw, 30px);
    color: var(--cream);
    letter-spacing: 0.5px;
    margin: 0;
  }

  .wordmark span {
    color: var(--marigold);
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    max-width: 420px;
    width: calc(100% - 40px);
    margin-top: -40px;
    padding: 36px 28px 32px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(74, 14, 24, 0.18);
  }

  .firefly-wrap {
    width: 84px;
    height: 84px;
    margin: 0 auto 18px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .glow {
    position: absolute;
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(244,163,0,0.55) 0%, rgba(244,163,0,0) 70%);
    animation: pulse 2.4s ease-in-out infinite;
  }

  .firefly-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--marigold);
    box-shadow: 0 0 16px 4px rgba(244, 163, 0, 0.9);
    position: relative;
    z-index: 2;
  }

  .check {
    position: absolute;
    z-index: 3;
    color: #ffffff;
    font-size: 13px;
    font-weight: 700;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(0.85); opacity: 0.6; }
    50% { transform: scale(1.15); opacity: 1; }
  }

  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 24px;
    margin: 0 0 10px;
    color: var(--maroon-deep);
  }

  p.sub {
    font-size: 15px;
    line-height: 1.55;
    color: var(--charcoal);
    margin: 0 0 26px;
  }

  .order-ref {
    display: inline-block;
    font-family: 'Inter', monospace;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: var(--ash);
    background: var(--cream);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 26px;
  }

  .cta {
    display: inline-block;
    width: 100%;
    background: var(--marigold);
    color: var(--maroon-deep);
    font-weight: 600;
    font-size: 15px;
    text-decoration: none;
    padding: 14px 20px;
    border-radius: 12px;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }

  .cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 18px rgba(244, 163, 0, 0.35);
  }

  footer {
    margin-top: 26px;
    font-size: 12px;
    color: var(--ash);
    text-align: center;
  }

  @media (prefers-reduced-motion: reduce) {
    .glow { animation: none; opacity: 0.85; }
  }
</style>
</head>
<body>

  <div class="band">
    <p class="wordmark">JOHNNY <span>&</span> JUGNU</p>
  </div>

  <div class="card">
    <div class="firefly-wrap">
      <div class="glow"></div>
      <div class="firefly-dot"></div>
      <div class="check">✓</div>
    </div>

    <h1>Payment received</h1>
    <p class="sub">Your order is confirmed and already on its way to the kitchen. We'll have it ready shortly.</p>

    <span class="order-ref" id="orderRefBox">Order confirmed</span>
    
    <footer>JOHNNY & JUGNU · Lahore</footer>
  </div>

  <script>
    // If Safepay appends order info as a URL param (e.g. ?order_id=JJ-462703),
    // show it here automatically.
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id');
    if (orderId) {
      document.getElementById('orderRefBox').textContent = 'Order ' + orderId;
    }
  </script>

</body>
</html>
