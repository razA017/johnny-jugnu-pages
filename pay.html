<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay Your Order — JOHNNY & JUGNU</title>
<script type="text/javascript" src="https://unpkg.com/@sfpy/checkout-components@0.1.0/dist/sfpy-checkout.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Inter:wght@400;500;600&display=swap');

  :root {
    --maroon: #6E1423;
    --maroon-deep: #4A0E18;
    --cream: #FFF6E5;
    --marigold: #F4A300;
    --ash: #8C8073;
    --charcoal: #241412;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--cream);
    font-family: 'Inter', sans-serif;
    color: var(--charcoal);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .band {
    width: 100%;
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-deep) 100%);
    padding: 28px 20px 60px;
    text-align: center;
  }

  .wordmark {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: clamp(22px, 6vw, 30px);
    color: var(--cream);
    letter-spacing: 0.5px;
    margin: 0;
  }

  .wordmark span { color: var(--marigold); }

  .card {
    background: #ffffff;
    border-radius: 20px;
    max-width: 420px;
    width: calc(100% - 40px);
    margin-top: -40px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(74, 14, 24, 0.18);
  }

  h1 {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 22px;
    margin: 0 0 6px;
    color: var(--maroon-deep);
  }

  .amount {
    font-family: 'Baloo 2', sans-serif;
    font-weight: 800;
    font-size: 34px;
    color: var(--maroon-deep);
    margin: 10px 0 4px;
  }

  .order-ref {
    display: inline-block;
    font-family: 'Inter', monospace;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: var(--ash);
    background: var(--cream);
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 26px;
  }

  #safepay-button-container {
    margin-top: 10px;
  }

  .missing-info {
    color: var(--maroon);
    font-size: 14px;
    padding: 20px 0;
  }

  footer {
    margin-top: 26px;
    font-size: 12px;
    color: var(--ash);
    text-align: center;
  }
</style>
</head>
<body>

  <div class="band">
    <p class="wordmark">JOHNNY <span>&</span> JUGNU</p>
  </div>

  <div class="card">
    <h1>Complete your payment</h1>
    <div class="amount" id="amountDisplay">Rs. --</div>
    <span class="order-ref" id="orderRefBox">Order --</span>

    <div id="safepay-button-container"></div>
    <div id="missingInfo" class="missing-info" style="display:none;">
      This payment link is missing order details. Please contact the restaurant for a new link.
    </div>

    <footer>JOHNNY & JUGNU · Lahore</footer>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('order_id');
    const amount = parseFloat(params.get('amount'));

    if (!orderId || !amount) {
      document.getElementById('missingInfo').style.display = 'block';
    } else {
      document.getElementById('orderRefBox').textContent = 'Order ' + orderId;
      document.getElementById('amountDisplay').textContent = 'Rs. ' + amount.toFixed(2);

      safepay
        .Button({
          env: "sandbox", // change to "production" when you go live
          client: {
            sandbox: "YOUR_SAFEPAY_SANDBOX_PUBLIC_KEY",
            production: "YOUR_SAFEPAY_PRODUCTION_PUBLIC_KEY"
          },
          style: {
            mode: "light",
            size: "large",
            variant: "primary"
          },
          orderId: orderId,
          source: "n8n",
          payment: {
            currency: "PKR",
            amount: amount
          },
          onPayment: function (data) {
            // The real payment confirmation still comes from Safepay's webhook to n8n
            // (that's what actually marks the order Paid in your Google Sheet).
            // This redirect is just what the customer sees on their screen.
            window.location.href = "thank_you.html?order_id=" + encodeURIComponent(orderId);
          },
          onCancel: function () {
            window.location.href = "payment_failed.html?order_id=" + encodeURIComponent(orderId);
          },
        })
        .render("#safepay-button-container");
    }
  </script>

</body>
</html>
